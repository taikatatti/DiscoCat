<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disco</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: white;
      font-family: Arial, sans-serif;
      background: #090712;
      cursor: crosshair;
    }

    .room {
      position: relative;
      width: min(900px, 94vw);
      height: min(620px, 88vh);
      overflow: hidden;
      border: 7px solid #25194c;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 13%, #7c39ff55 0 5%, transparent 24%),
        linear-gradient(#17102e 0 72%, #251846 72% 74%, #100d22 74%);
      box-shadow: 0 0 45px #672cff55;
    }

    .room::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .45;
      background: radial-gradient(ellipse at center, transparent 35%, #000 110%);
    }

    .sign {
      position: absolute;
      top: 40px;
      left: 50%;
      z-index: 3;
      transform: translateX(-50%);
      font-weight: 900;
      font-size: clamp(22px, 4vw, 42px);
      letter-spacing: 5px;
      color: #ff8cec;
      text-shadow: 0 0 8px #ff47dc, 0 0 22px #9f34ff;
    }

    .chain {
      position: absolute;
      left: 50%;
      top: 0;
      width: 4px;
      height: 142px;
      background: repeating-linear-gradient(#bbb 0 7px, #555 7px 12px);
      transform: translateX(-50%);
    }

    .disco-ball {
      position: absolute;
      z-index: 2;
      top: 125px;
      left: 50%;
      width: 115px;
      height: 115px;
      border-radius: 50%;
      transform: translateX(-50%);
      background:
        linear-gradient(90deg, transparent 47%, #ffffff99 48% 52%, transparent 53%),
        linear-gradient(transparent 47%, #ffffff99 48% 52%, transparent 53%),
        repeating-linear-gradient(45deg, #d8e8ff 0 10px, #8b9abd 10px 20px);
      box-shadow: 0 0 15px #fff, 0 0 50px #8d61ff, 0 0 95px #ff40ce;
      animation: spin 3s linear infinite;
    }

    .light {
      position: absolute;
      z-index: 1;
      top: 225px;
      left: 50%;
      width: 500px;
      height: 530px;
      transform: translateX(-50%);
      transform-origin: top;
      clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%);
      opacity: .38;
      background: linear-gradient(90deg, #ff52d955, #54dfffaa, #ffec58aa, #a04dffaa);
      animation: sway 4s ease-in-out infinite alternate;
    }

    .dance-floor {
  position: absolute;
  z-index: 2;
  left: -8%;
  right: -8%;
  bottom: -3px;
  height: 175px;
  transform: perspective(310px) rotateX(46deg);
  transform-origin: bottom center;
  background:
    conic-gradient(
      from 90deg,
      #6c45ff 25%,
      #28baff 0 50%,
      #a04dff 0 75%,
      #2376e8 0
    ) 0 0 / 58px 58px;
  box-shadow: 0 -10px 35px #6b4dff88;
  animation: floor-flash .65s steps(2, end) infinite alternate;
}

@keyframes floor-flash {
  0% {
    filter: brightness(.7) saturate(.8);
    background-position: 0 0;
  }

  100% {
    filter: brightness(1.55) saturate(1.35) hue-rotate(16deg);
    background-position: 29px 29px;
  }
}

   /* Pyörivät neonlaserit */
.laser {
  position: absolute;
  z-index: 1;
  top: 175px;
  left: 50%;
  width: 580px;
  height: 7px;
  transform-origin: 0 50%;
  pointer-events: none;
  opacity: .8;
  mix-blend-mode: screen;
  filter: blur(1px);
  box-shadow: 0 0 10px currentColor, 0 0 28px currentColor;
}

.laser-a {
  color: #43eaff;
  background: linear-gradient(90deg, #43eaff, transparent 82%);
  animation: laser-a 3.3s linear infinite;
}

.laser-b {
  color: #ed56ff;
  background: linear-gradient(90deg, #ed56ff, transparent 78%);
  animation: laser-b 4.1s linear infinite;
}

.laser-c {
  color: #706dff;
  background: linear-gradient(90deg, #706dff, transparent 75%);
  animation: laser-c 2.7s linear infinite;
}

@keyframes laser-a {
  from { transform: rotate(-38deg) scaleX(.6); }
  50% { transform: rotate(52deg) scaleX(1); }
  to { transform: rotate(322deg) scaleX(.7); }
}

@keyframes laser-b {
  from { transform: rotate(135deg) scaleX(.8); }
  50% { transform: rotate(235deg) scaleX(.55); }
  to { transform: rotate(495deg) scaleX(.9); }
}

@keyframes laser-c {
  from { transform: rotate(72deg) scaleX(.45); }
  50% { transform: rotate(-42deg) scaleX(1); }
  to { transform: rotate(-288deg) scaleX(.65); }
}

/* Kaukaiset tanssivat varjohahmot */
.distant-dancers {
  position: absolute;
  z-index: 1;
  inset: 0;
  pointer-events: none;
}

.shadow {
  position: absolute;
  bottom: 135px;
  width: 56px;
  height: 137px;
  opacity: .82;
  filter: drop-shadow(0 0 10px #bb4dff88);
  animation: shadow-dance .9s ease-in-out infinite alternate;
}

.shadow-body {
  position: absolute;
  top: 30px;
  left: 14px;
  width: 29px;
  height: 74px;
  border-radius: 45% 45% 20% 20%;
  background: #100b29;
}

.shadow-body::before {
  content: "";
  position: absolute;
  top: -29px;
  left: 3px;
  width: 24px;
  height: 27px;
  border-radius: 50%;
  background: #100b29;
}

.shadow-body::after {
  content: "";
  position: absolute;
  bottom: -27px;
  left: 2px;
  width: 25px;
  height: 35px;
  border-radius: 0 0 12px 12px;
  background: linear-gradient(90deg, #100b29 0 42%, transparent 42% 58%, #100b29 58%);
}

.shadow-arms,
.shadow-arms::after {
  position: absolute;
  top: 39px;
  width: 17px;
  height: 65px;
  border-radius: 12px;
  background: #100b29;
  content: "";
  transform-origin: top center;
}

.shadow-arms {
  left: 8px;
  transform: rotate(52deg);
  animation: shadow-arm-left .9s ease-in-out infinite alternate;
}

.shadow-arms::after {
  left: 31px;
  top: -9px;
  transform: rotate(-104deg);
  animation: shadow-arm-right .9s ease-in-out infinite alternate;
}

.dancer-one { left: 12%; transform: scale(.78); animation-delay: -.3s; }
.dancer-two { left: 29%; transform: scale(.58); opacity: .58; animation-delay: -.7s; }
.dancer-three { right: 12%; transform: scale(.72); animation-delay: -.15s; }

@keyframes shadow-dance {
  to { translate: 0 -13px; rotate: 5deg; }
}

@keyframes shadow-arm-left {
  to { transform: rotate(105deg); }
}

@keyframes shadow-arm-right {
  to { transform: rotate(-142deg); }
}
    
    .cat {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 78px;
      width: 170px;
      height: 190px;
      transform: translateX(-50%);
      animation: dance .62s ease-in-out infinite alternate;
      filter: drop-shadow(0 12px 7px #0008);
    }

    .head {
      position: absolute;
      left: 38px;
      top: 4px;
      width: 98px;
      height: 87px;
      border-radius: 48% 48% 45% 45%;
      background: #f3a650;
    }

    .ear { position: absolute; top: -18px; width: 37px; height: 45px; background: #f3a650; }
    .ear.left { left: 2px; clip-path: polygon(0 0, 100% 75%, 0 100%); }
    .ear.right { right: 2px; clip-path: polygon(100% 0, 100% 100%, 0 75%); }
    .eye { position: absolute; top: 36px; width: 12px; height: 16px; border-radius: 50%; background: #171018; }
    .eye.left { left: 24px; } .eye.right { right: 24px; }
    .nose { position: absolute; top: 55px; left: 44px; width: 10px; height: 8px; border-radius: 50%; background: #e86c7d; }

    .body { position: absolute; left: 48px; top: 77px; width: 78px; height: 89px; border-radius: 42% 42% 36% 36%; background: #f3a650; }
    .leg { position: absolute; bottom: 0; width: 29px; height: 55px; border-radius: 20px; background: #f3a650; }
    .leg.left { left: 54px; transform: rotate(13deg); } .leg.right { right: 45px; transform: rotate(-13deg); }
    .arm { position: absolute; top: 89px; width: 26px; height: 80px; border-radius: 20px; background: #f3a650; transform-origin: top center; }
    .arm.left { left: 37px; transform: rotate(58deg); animation: arm-left .62s ease-in-out infinite alternate; }
    .arm.right { right: 31px; transform: rotate(-58deg); animation: arm-right .62s ease-in-out infinite alternate; }
    .tail { position: absolute; right: 8px; top: 98px; width: 67px; height: 62px; border: 17px solid #f3a650; border-left: 0; border-bottom: 0; border-radius: 0 70px 0 0; transform: rotate(20deg); }

.miku {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 62px;
  width: 190px;
  height: 235px;
  transform: translateX(-50%);
  transform-origin: bottom center;
  filter: drop-shadow(0 12px 7px #0009);
  animation: miku-dance .82s ease-in-out infinite alternate;
}

/* Pitkät turkoosit tuplatukat */
.twintail {
  position: absolute;
  z-index: -1;
  top: 31px;
  width: 49px;
  height: 151px;
  border-radius: 28px 28px 43px 43px;
  background: linear-gradient(90deg, #078ca5, #61f6e9 48%, #119db5);
  box-shadow: inset -8px 0 #00687e77, 0 4px 0 #08637e;
  transform-origin: top center;
}
.twintail::before {
  content: "";
  position: absolute;
  top: -4px;
  width: 53px;
  height: 14px;
  border-radius: 7px;
  background: #292b49;
  box-shadow: 0 3px #fa58a9;
}
.twintail i {
  position: absolute;
  inset: 27px 11px auto;
  height: 95px;
  border-left: 3px solid #d4fffa88;
  border-radius: 50%;
}
.twintail.left { left: 0; animation: hair-left .82s ease-in-out infinite alternate; }
.twintail.right { right: 0; animation: hair-right .82s ease-in-out infinite alternate; }

.hair-cap {
  position: absolute;
  top: 4px;
  left: 30px;
  width: 130px;
  height: 111px;
  border-radius: 49% 49% 39% 39%;
  background: linear-gradient(100deg, #5af5e8, #1ac0c4 57%, #0b829c);
  box-shadow: inset -8px -8px #00728b66;
}

.face {
  position: absolute;
  z-index: 2;
  top: 25px;
  left: 44px;
  width: 102px;
  height: 91px;
  overflow: hidden;
  border: 3px solid #563b60;
  border-radius: 45% 45% 47% 47%;
  background: #ffe5d7;
  box-shadow: inset -7px -5px #efb1b866;
}

.fringe {
  position: absolute;
  top: -13px;
  left: -1px;
  width: 104px;
  height: 51px;
  background:
    radial-gradient(ellipse at 17% 20%, #42ded6 0 31%, transparent 32%),
    radial-gradient(ellipse at 50% 13%, #42ded6 0 37%, transparent 38%),
    radial-gradient(ellipse at 84% 20%, #42ded6 0 31%, transparent 32%);
}

.miku-eye {
  position: absolute;
  z-index: 2;
  top: 45px;
  width: 19px;
  height: 25px;
  overflow: hidden;
  border-radius: 48% 48% 55% 55%;
  background: linear-gradient(#27376d 12%, #159fc9 55%, #6ef8e8);
  box-shadow: inset 4px 4px white, inset -3px -3px #2454a8;
}
.miku-eye i {
  position: absolute;
  right: 3px;
  bottom: 4px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: white;
}
.miku-eye.left { left: 21px; }
.miku-eye.right { right: 21px; }

.blush {
  position: absolute;
  z-index: 2;
  top: 72px;
  width: 18px;
  height: 7px;
  border-radius: 50%;
  background: #f48ba4aa;
}
.blush.left { left: 9px; }
.blush.right { right: 9px; }

.miku-mouth {
  position: absolute;
  z-index: 2;
  top: 72px;
  left: 44px;
  width: 13px;
  height: 8px;
  border-bottom: 2px solid #df6383;
  border-radius: 50%;
}

.headphones {
  position: absolute;
  z-index: 4;
  top: 45px;
  left: 36px;
  width: 118px;
  height: 46px;
  border: 5px solid #303a60;
  border-bottom: 0;
  border-radius: 50% 50% 0 0;
}
.headphones::after {
  content: "";
  position: absolute;
  top: 34px;
  right: -11px;
  width: 30px;
  height: 5px;
  border-radius: 5px;
  background: #303a60;
  transform: rotate(-26deg);
  box-shadow: 25px 11px #fb56a8;
}

.neck {
  position: absolute;
  top: 108px;
  left: 84px;
  width: 22px;
  height: 20px;
  background: #ffe5d7;
}

.miku-top {
  position: absolute;
  z-index: 2;
  top: 120px;
  left: 55px;
  width: 80px;
  height: 67px;
  border: 3px solid #252b46;
  border-radius: 18px 18px 7px 7px;
  background: linear-gradient(90deg, #343b59, #778299 50%, #343b59);
}

.collar {
  position: absolute;
  left: 10px;
  top: -3px;
  width: 54px;
  height: 26px;
  clip-path: polygon(0 0, 50% 100%, 100% 0, 83% 0, 50% 52%, 17% 0);
  background: #f6f8ff;
}

.miku-tie {
  position: absolute;
  top: 15px;
  left: 34px;
  width: 13px;
  height: 33px;
  clip-path: polygon(15% 0, 85% 0, 100% 24%, 50% 100%, 0 24%);
  background: #18d8d2;
  box-shadow: 0 0 6px #52fff4aa;
}

.miku-skirt {
  position: absolute;
  z-index: 3;
  top: 175px;
  left: 45px;
  width: 100px;
  height: 35px;
  clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);
  background: repeating-linear-gradient(90deg, #2f3750 0 14px, #66748a 14px 27px);
  border-bottom: 3px solid #20263e;
}

.miku-arm {
  position: absolute;
  z-index: 1;
  top: 124px;
  width: 22px;
  height: 78px;
  border: 3px solid #563b62;
  border-radius: 18px;
  background: #ffe5d7;
  transform-origin: top center;
}
.miku-arm span {
  position: absolute;
  bottom: 0;
  left: -4px;
  width: 24px;
  height: 31px;
  border-radius: 8px;
  background: #242b45;
  border-top: 4px solid #24ddd5;
}
.miku-arm.left { left: 38px; animation: miku-arm-left .82s ease-in-out infinite alternate; }
.miku-arm.right { right: 33px; animation: miku-arm-right .82s ease-in-out infinite alternate; }

.miku-leg {
  position: absolute;
  top: 202px;
  width: 28px;
  height: 42px;
  border: 3px solid #151a30;
  border-radius: 13px 13px 7px 7px;
  background: #242b45;
}
.miku-leg::after {
  content: "";
  position: absolute;
  bottom: -8px;
  left: -5px;
  width: 36px;
  height: 13px;
  border-radius: 13px 8px 4px 4px;
  background: #303850;
}
.miku-leg.left { left: 65px; transform: rotate(8deg); }
.miku-leg.right { right: 65px; transform: rotate(-8deg); }

@keyframes miku-dance {
  from { transform: translateX(-50%) rotate(-3deg) translateY(0); }
  to { transform: translateX(-50%) rotate(3deg) translateY(-13px); }
}
@keyframes miku-arm-left {
  from { transform: rotate(57deg); }
  to { transform: rotate(112deg); }
}
@keyframes miku-arm-right {
  from { transform: rotate(-57deg); }
  to { transform: rotate(-112deg); }
}
@keyframes hair-left {
  from { transform: rotate(12deg); }
  to { transform: rotate(-5deg); }
}
@keyframes hair-right {
  from { transform: rotate(-12deg); }
  to { transform: rotate(5deg); }
}
    
    .heart {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      font-size: 30px;
      animation: float-away .9s ease-out forwards;
    }

    @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }
    @keyframes sway { to { transform: translateX(-50%) rotate(8deg); } }
    @keyframes dance { to { transform: translateX(-50%) rotate(6deg) translateY(-16px); } }
    @keyframes arm-left { to { transform: rotate(105deg); } }
    @keyframes arm-right { to { transform: rotate(-105deg); } }
    @keyframes float-away { to { transform: translateY(-55px) scale(1.6) rotate(18deg); opacity: 0; } }

    @media (max-width: 500px) {
      .cat { transform: translateX(-50%) scale(.8); transform-origin: bottom; }
      .disco-ball { transform: translateX(-50%) scale(.8); }
    }
  </style>
</head>
<body>
  <main class="room">
    <div class="sign"> ♥ ♥ Adan Hatsune Miku Disco ♥ ♥ </div>
    <div class="chain"></div>
    <div class="disco-ball"></div>
    <div class="light"></div>
    <div class="laser laser-a"></div>
<div class="laser laser-b"></div>
<div class="laser laser-c"></div>

<div class="distant-dancers" aria-hidden="true">
  <div class="shadow dancer-one"><span class="shadow-body"></span><span class="shadow-arms"></span></div>
  <div class="shadow dancer-two"><span class="shadow-body"></span><span class="shadow-arms"></span></div>
  <div class="shadow dancer-three"><span class="shadow-body"></span><span class="shadow-arms"></span></div>
</div>
    <div class="dance-floor"></div>
    
<div class="miku" aria-label="Tanssiva Hatsune Miku">
  <div class="twintail left"><i></i></div>
  <div class="twintail right"><i></i></div>
  <div class="hair-cap"></div>

  <div class="face">
    <div class="fringe"></div>
    <div class="miku-eye left"><i></i></div>
    <div class="miku-eye right"><i></i></div>
    <div class="blush left"></div><div class="blush right"></div>
    <div class="miku-mouth"></div>
  </div>

  <div class="headphones"></div>
  <div class="neck"></div>

  <div class="miku-arm left"><span></span></div>
  <div class="miku-arm right"><span></span></div>

  <div class="miku-top">
    <div class="collar"></div>
    <div class="miku-tie"></div>
  </div>
  <div class="miku-skirt"></div>

  <div class="miku-leg left"></div>
  <div class="miku-leg right"></div>
</div>

  <script>
    let lastHeart = 0;
    document.addEventListener('pointermove', (event) => {
      if (Date.now() - lastHeart < 55) return;
      lastHeart = Date.now();
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = Math.random() > .5 ? '♥' : '♥';
      heart.style.left = `${event.clientX - 10}px`;
      heart.style.top = `${event.clientY - 10}px`;
      heart.style.color = Math.random() > .5 ? '#ff63df' : '#80edff';
      document.body.appendChild(heart);
      heart.addEventListener('animationend', () => heart.remove());
    });
  </script>
</body>
</html>
